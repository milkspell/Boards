<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Boards">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1014">
<title>Boards</title>
<style>
:root{--bg:#eceef2;--cd:#fff;--tx:#14171c;--mu:#6c7683;--ac:#2f5bff;--bd:#dde1e7;--gt:#1f8a52;--ql:#2f5bff;--hd:rgba(255,255,255,.88)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d11;--cd:#14171d;--tx:#e9ebef;--mu:#8791a0;--ac:#7b9bff;--bd:#232830;--gt:#79c98f;--ql:#8fabff;--hd:rgba(14,16,20,.88)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:var(--hd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.hr{display:flex;align-items:center;height:48px;padding:0 8px;gap:4px}
#ttl{flex:1;font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
button{font:inherit;color:var(--ac);background:none;border:0;padding:8px 10px;border-radius:10px;cursor:pointer}
button:active{background:var(--bd)}
#back{font-size:28px;line-height:1;padding:2px 12px 6px}
.pill{background:var(--ac);color:#fff;font-weight:600;font-size:14px;padding:7px 13px;border-radius:99px}
.pill:active{opacity:.8;background:var(--ac)}
main{padding:calc(56px + env(safe-area-inset-top,0px)) 10px calc(70px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--hd);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd)}
nav a{flex:1;text-align:center;padding:11px 0;color:var(--mu);font-size:13px;font-weight:600;text-decoration:none}
nav a.on{color:var(--ac)}
.srch{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;background:var(--cd);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-weight:600;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.bd{display:flex;align-items:center;gap:12px;background:var(--cd);border-radius:14px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:var(--tx)}
.bd b{font-size:17px;min-width:44px;color:var(--ac)}
.bd span{flex:1;min-width:0}.bd small{display:block;color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.star{font-size:20px;color:var(--mu);padding:4px 8px}.star.on{color:#f5a623}
.grid{columns:2;column-gap:8px}
.card{break-inside:avoid;display:block;background:var(--cd);border-radius:14px;overflow:hidden;margin-bottom:8px;text-decoration:none;color:var(--tx)}
.card img{display:block;width:100%;max-height:260px;object-fit:cover;background:var(--bd)}
.cb{padding:9px 11px 11px}
.cb h4{margin:0 0 3px;font-size:15px;line-height:1.25}
.cb p{margin:0;font-size:13.5px;color:var(--mu);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ct{margin-top:8px;font-size:12.5px;color:var(--mu);font-weight:600}
.seg{display:flex;background:var(--bd);border-radius:10px;padding:2px;margin-bottom:10px}
.seg button{flex:1;color:var(--mu);font-size:14px;font-weight:600;padding:6px}
.seg button.on{background:var(--cd);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.po{background:var(--cd);border-radius:14px;padding:12px 13px;margin-bottom:8px;scroll-margin-top:64px;transition:box-shadow .3s}
.po.op{border-left:4px solid var(--ac)}.po.hi{box-shadow:0 0 0 2px var(--ac)}
.ph{display:flex;gap:8px;align-items:baseline;font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.nm{font-weight:700;color:var(--gt);font-size:14px}.mu,.no{color:var(--mu)}.no{margin-left:auto;font-variant-numeric:tabular-nums}
.po h3{margin:0 0 6px;font-size:17px;line-height:1.25}
.im{margin-bottom:8px}.im img{display:block;max-width:100%;height:auto;border-radius:10px;background:var(--bd);cursor:zoom-in}
.im small{display:block;color:var(--mu);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cm{overflow-wrap:anywhere;font-size:15.5px}.cm pre{overflow-x:auto;background:var(--bg);padding:8px;border-radius:8px;font-size:13px}
.gt{color:var(--gt)}.ql{color:var(--ql);text-decoration:none;font-weight:500;cursor:pointer}
s.sp{background:var(--tx);color:var(--tx);text-decoration:none;border-radius:3px}s.sp.rev{background:none;color:inherit}
.bl{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:13px}.bl:empty{display:none}
.msg{text-align:center;color:var(--mu);padding:48px 20px}
.msg button{margin-top:10px;background:var(--ac);color:#fff;font-weight:600}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#sheet[hidden],#view[hidden]{display:none}
#sheet>div{width:100%;max-height:75%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:12px 10px calc(14px + env(safe-area-inset-bottom,0px))}
#sheet .po{margin:0}
#view{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center}
#view img,#view video{max-width:100%;max-height:100%}
#view a{position:absolute;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));color:#fff;background:rgba(255,255,255,.18);padding:8px 14px;border-radius:99px;font-size:14px;text-decoration:none}
#x{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;color:#fff;font-size:28px;line-height:1;background:rgba(255,255,255,.18);border-radius:99px;padding:6px 13px}
</style></head><body>
<header><div class="hr"><button id="back" hidden>‹</button><div id="ttl">Boards</div><button id="star" hidden></button><button id="ref" aria-label="Refresh">↻</button><button id="act" class="pill" hidden>Post</button></div></header>
<main id="app"></main>
<nav><a href="#/" data-n="b">Boards</a><a id="nvc" href="#/g" data-n="c">Catalog</a><a href="#/watch" data-n="w">Watching</a></nav>
<div id="sheet" hidden></div>
<div id="view" hidden></div>
<script>
const A='https://a.4cdn.org',I='https://i.4cdn.org',W='https://boards.4chan.org';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let favs=ls.get('favs',['g','a','v','vg']),watch=ls.get('watch',[]),last=ls.get('last','g'),sort=ls.get('sort','bump'),boards=null,byNo={},cur={};
const J=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};
const ago=t=>{const s=Date.now()/1e3-t;return s<60?'now':s<3600?(s/60|0)+'m':s<86400?(s/3600|0)+'h':(s/86400|0)+'d'};
const plain=h=>new DOMParser().parseFromString(h||'','text/html').body.textContent;
function walk(n){let o='';n.childNodes.forEach(c=>{if(c.nodeType===3)o+=esc(c.textContent);else if(c.nodeType===1){const t=c.tagName.toLowerCase();
if(t==='br')o+='<br>';
else if(t==='a'){const m=c.textContent.match(/^>>(\d+)/);o+=m?`<a class="ql" data-id="${m[1]}">${esc(c.textContent)}</a>`:esc(c.textContent)}
else if(t==='span'&&c.className==='quote')o+=`<span class="gt">${walk(c)}</span>`;
else if(t==='s')o+=`<s class="sp">${walk(c)}</s>`;
else if(t==='pre')o+=`<pre>${walk(c)}</pre>`;
else if(t==='b'||t==='i'||t==='u')o+=`<${t}>${walk(c)}</${t}>`;
else o+=walk(c)}});return o}
const clean=h=>walk(new DOMParser().parseFromString(h||'','text/html').body);

function head(title,{back,act,star}={}){
 $('#ttl').textContent=title;
 const b=$('#back');b.hidden=!back;b.onclick=()=>{location.hash=back};
 const a=$('#act');a.hidden=!act;if(act){a.onclick=()=>window.open(act,'_blank','noopener')}
 const s=$('#star');s.hidden=!star;if(star){s.textContent=star.on?'★':'☆';s.onclick=star.fn}
}
function navOn(k){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.n===k));$('#nvc').href='#/'+last}
const loading=()=>{app.innerHTML='<div class="msg">Loading…</div>'};
const fail=()=>{app.innerHTML='<div class="msg">Couldn’t reach 4chan.<br>Check your connection and try again.<br><button onclick="route()">Try again</button></div>'};

async function getBoards(){if(!boards)boards=(await J(A+'/boards.json')).boards;return boards}

async function pgBoards(){
 head('Boards');navOn('b');loading();
 try{const bs=await getBoards();
  const row=b=>`<a class="bd" href="#/${b.board}"><b>/${b.board}/</b><span>${esc(b.title)}<small>${esc(plain(b.meta_description))}</small></span><button class="star ${favs.includes(b.board)?'on':''}" data-fav="${b.board}">★</button></a>`;
  const fv=favs.map(f=>bs.find(b=>b.board===f)).filter(Boolean);
  app.innerHTML=`<input class="srch" id="q" type="search" placeholder="Search boards" autocomplete="off">${fv.length?`<div class="chips">${fv.map(b=>`<a class="chip" href="#/${b.board}">/${b.board}/</a>`).join('')}</div>`:''}<div id="bl">${bs.map(row).join('')}</div>`;
  $('#q').oninput=e=>{const q=e.target.value.toLowerCase();$('#bl').innerHTML=bs.filter(b=>(b.board+' '+b.title).toLowerCase().includes(q)).map(row).join('')};
 }catch(e){fail()}
}

async function pgCatalog(b){
 last=b;ls.set('last',b);navOn('c');loading();
 head('/'+b+'/',{back:'#/',act:`${W}/${b}/`});
 try{
  const pages=await J(`${A}/${b}/catalog.json`);let th=pages.flatMap(p=>p.threads);
  const draw=()=>{
   let l=th.slice();if(sort==='replies')l.sort((x,y)=>y.replies-x.replies);if(sort==='new')l.sort((x,y)=>y.no-x.no);
   app.innerHTML=`<div class="seg">${[['bump','Active'],['replies','Popular'],['new','New']].map(([k,n])=>`<button data-s="${k}" class="${sort===k?'on':''}">${n}</button>`).join('')}</div><div class="grid">${l.map(t=>`<a class="card" href="#/${b}/${t.no}">${t.tim?`<img loading="lazy" src="${I}/${b}/${t.tim}s.jpg" width="${t.tn_w}" height="${t.tn_h}" alt="">`:''}<div class="cb">${t.sub?`<h4>${esc(plain(t.sub))}</h4>`:''}<p>${esc(plain((t.com||'').replace(/<br>/g,' ')))}</p><div class="ct">${t.replies} replies · ${t.images} images · ${ago(t.time)}</div></div></a>`).join('')}</div>`;
   app.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{sort=x.dataset.s;ls.set('sort',sort);draw()});
  };draw();
 }catch(e){fail()}
}

function postHTML(p,b,op){
 const im=p.tim?`<div class="im"><img loading="lazy" src="${I}/${b}/${p.tim}s.jpg" width="${p.tn_w}" height="${p.tn_h}" data-b="${b}" data-f="${p.tim}${p.ext}" alt=""><small>${esc(plain(p.filename))}${p.ext} · ${p.w}×${p.h}</small></div>`:'';
 return `<article class="po${op?' op':''}" id="p${p.no}"><div class="ph"><span class="nm">${clean(p.name||'Anonymous')}</span>${p.trip?`<span class="mu">${esc(p.trip)}</span>`:''}<span class="mu">${ago(p.time)}</span><span class="no">${p.no}</span></div>${p.sub?`<h3>${clean(p.sub)}</h3>`:''}${im}<div class="cm">${clean(p.com)}</div><div class="bl" id="bl${p.no}"></div></article>`;
}

async function pgThread(b,no){
 last=b;ls.set('last',b);navOn('c');loading();
 const url=`${W}/${b}/thread/${no}`;
 try{
  const ps=(await J(`${A}/${b}/thread/${no}.json`)).posts;
  byNo={};cur={b,html:{}};
  const op=ps[0],on=()=>watch.some(w=>w.b===b&&w.no==no);
  const setHead=()=>head((op.sub?plain(op.sub):'Thread')||'Thread',{back:'#/'+b,act:url,star:{on:on(),fn:()=>{
   if(on())watch=watch.filter(w=>!(w.b===b&&w.no==no));else watch.unshift({b,no,t:plain(op.sub||op.com).slice(0,80),tim:op.tim});
   ls.set('watch',watch);setHead()}}});
  setHead();
  ps.forEach(p=>{byNo[p.no]=postHTML(p,b,false)});
  app.innerHTML=ps.map((p,i)=>postHTML(p,b,i===0)).join('');
  const bk={};ps.forEach(p=>{[...clean(p.com).matchAll(/data-id="(\d+)"/g)].forEach(m=>{(bk[m[1]]=bk[m[1]]||[]).push(p.no)})});
  Object.keys(bk).forEach(id=>{const e=$('#bl'+id);if(e)e.innerHTML=bk[id].map(n=>`<a class="ql" data-id="${n}">↩ ${n}</a>`).join('')});
 }catch(e){fail()}
}

function pgWatch(){
 head('Watching');navOn('w');
 app.innerHTML=watch.length?watch.map(w=>`<a class="bd" href="#/${w.b}/${w.no}">${w.tim?`<img src="${I}/${w.b}/${w.tim}s.jpg" width="48" height="48" style="object-fit:cover;border-radius:10px" alt="">`:''}<span><b style="min-width:0;color:var(--tx)">/${w.b}/</b> ${esc(w.t||'Thread '+w.no)}<small>${w.no}</small></span><button class="star on" data-unw="${w.no}">✕</button></a>`).join(''):'<div class="msg">No watched threads yet.<br>Tap ☆ inside a thread to save it here.</div>';
}

function route(){
 const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
 window.scrollTo(0,0);
 if(!p.length)pgBoards();else if(p[0]==='watch')pgWatch();else if(p[1])pgThread(p[0],p[1]);else pgCatalog(p[0]);
}
addEventListener('hashchange',route);
$('#ref').onclick=route;

document.addEventListener('click',e=>{
 const t=e.target;
 const f=t.closest('[data-fav]');if(f){e.preventDefault();const k=f.dataset.fav;favs=favs.includes(k)?favs.filter(x=>x!==k):[...favs,k];ls.set('favs',favs);f.classList.toggle('on');return}
 const u=t.closest('[data-unw]');if(u){e.preventDefault();watch=watch.filter(w=>w.no!=u.dataset.unw);ls.set('watch',watch);pgWatch();return}
 const sp=t.closest('s.sp');if(sp){sp.classList.toggle('rev');return}
 const ql=t.closest('.ql');if(ql){const id=ql.dataset.id,h=byNo[id];if(!h)return;
  const inSheet=t.closest('#sheet'),el=document.getElementById('p'+id);
  if(!inSheet&&el&&el.getBoundingClientRect().top>60&&el.getBoundingClientRect().bottom<innerHeight-60){el.classList.add('hi');setTimeout(()=>el.classList.remove('hi'),1200);return}
  const s=$('#sheet');s.innerHTML='<div>'+h.replace(/ id="p\d+"/,'')+'</div>';s.hidden=false;return}
 if(t.id==='sheet'){t.hidden=true;return}
 const im=t.closest('.im img');if(im){const u=`${I}/${im.dataset.b}/${im.dataset.f}`,v=$('#view'),vid=/\.(webm|mp4)$/.test(u);
  v.innerHTML=(vid?`<video src="${u}" controls autoplay loop playsinline></video>`:`<img src="${u}" alt="">`)+`<button id="x">×</button><a href="${u}" target="_blank" rel="noopener">Open original</a>`;v.hidden=false;return}
 if(t.id==='x'||t.id==='view'){const v=$('#view');v.hidden=true;v.innerHTML=''}
});

// generate a home-screen icon at runtime
try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#3b6cff');g.addColorStop(1,'#1a2a6c');x.fillStyle=g;x.fillRect(0,0,180,180);
 x.fillStyle='#fff';x.fillRect(40,46,100,18);x.fillRect(40,81,100,18);x.fillRect(40,116,64,18);
 const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)}catch(e){}
route();
</script></body></html>
